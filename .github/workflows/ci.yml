# Her push ve PR'da: Python (biçim + lint + testler, SQLite ve gerçek Postgres) ve site (biçim + derleme).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sunucu.txt
      - name: Bağımlılıklar
        run: pip install -r requirements-sunucu.txt pytest==9.1.1 ruff==0.17.1 httpx==0.28.1
      - name: Biçim ve lint
        run: |
          ruff format --check .
          ruff check .
      - name: Testler (SQLite)
        run: pytest -q
      - name: Testler (Postgres)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Biçim
        run: npm run format:check
      - name: Tip denetimi
        run: npm run check
      - name: Derleme (örnek veriyle)
        run: npm run build
