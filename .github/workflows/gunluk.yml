# Her sabah: ilanları topla, sınıflandır, yayınla, bülten gönder, bakım yap.
# Asıl tetikleyici Vercel Cron: 04:00–04:59 UTC arasında /api/cron/gunluk bu iş akışını başlatır (workflow_dispatch).
# Aşağıdaki schedule yedek: GitHub zamanlaması saatlerce gecikebildiği için (30.10: 6,5 saat) asıl saat olarak
# kullanılmıyor. İş bugün zaten tamamlandıysa yedek çalışma tarama yapmadan biter; bülten de günde bir kez gider.
# Site verisi (ilanlar.json, istatistik.json) web/public/veri/'ye yazılıp depoya eklenir; Vercel siteyi yeniden yayınlar.
# Günlük veri commit'i depoyu "hareketli" tutar: GitHub 60 gün değişiklik görmeyen depolarda zamanlanmış işleri durdurur.
# Elle onay modu (pilot, varsayılan açık): iş bülten göndermez, sonunda TEST_EPOSTA'ya önizleme gider; bülten
# "Bülteni gönder" iş akışıyla elle çıkar. Kapatmak için Actions değişkeni INTERNREADER_BULTEN_ELLE=0.
# Gizli değerler: Settings → Secrets and variables → Actions (bkz. docs/KURULUM_UCRETSIZ.md).
name: Günlük çalışma

on:
  schedule:
    - cron: "37 6 * * *" # yedek; UTC 06:37 = Türkiye 09:37 (dakika başı olmayan saatte gecikme daha az)
  workflow_dispatch:
    inputs:
      ilk_kurulum:
        description: "İlk kurulum: firma listesini içe aktar ve keşfi çalıştır (~15 dk ek, yapay zekâ kullanmaz)"
        type: boolean
        default: false

permissions:
  contents: write # site verisini depoya eklemek için

concurrency:
  group: internreader-veritabani # keşif ile aynı anda veritabanına yazmasın
  cancel-in-progress: false

jobs:
  calistir:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      INTERNREADER_GIZLI_ANAHTAR: ${{ secrets.INTERNREADER_GIZLI_ANAHTAR }}
      INTERNREADER_SITE_ADRESI: https://internreader.me
      SMTP_SUNUCU: ${{ secrets.SMTP_SUNUCU }}
      SMTP_PORT: "587"
      SMTP_KULLANICI: ${{ secrets.SMTP_KULLANICI }}
      SMTP_PAROLA: ${{ secrets.SMTP_PAROLA }}
      EPOSTA_KIMDEN: ${{ secrets.EPOSTA_KIMDEN }}
      INTERNREADER_BULTEN_ELLE: ${{ vars.INTERNREADER_BULTEN_ELLE || '1' }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Bağımlılıklar
        run: pip install -r requirements.txt
      - name: Gizli değerleri denetle
        run: |
          test -n "$DATABASE_URL" || { echo "::error::DATABASE_URL gizli değeri tanımlı değil"; exit 1; }
          test -n "$ANTHROPIC_API_KEY" || { echo "::error::ANTHROPIC_API_KEY gizli değeri tanımlı değil"; exit 1; }
          test -n "$INTERNREADER_GIZLI_ANAHTAR" || echo "::warning::INTERNREADER_GIZLI_ANAHTAR yok: bülten gönderilmez"
          test -n "$SMTP_SUNUCU" || echo "::warning::SMTP tanımlı değil: e-postalar gönderilmez, yalnızca dosyaya yazılır"
      - name: Bugün zaten çalıştı mı? (yalnızca yedek zamanlamada)
        id: kontrol
        if: ${{ github.event_name == 'schedule' }}
        run: echo "atla=$(python -m internreader bugun-calisti-mi)" >> "$GITHUB_OUTPUT"
      - name: İlk kurulum (firma listesi + keşif)
        if: ${{ inputs.ilk_kurulum }}
        run: |
          python -m internreader ice-aktar veri/firmalar.csv
          python -m internreader kesif
      - name: Tara, yayınla, bülten, bakım
        if: ${{ steps.kontrol.outputs.atla != 'true' }}
        run: python -m internreader calistir
      - name: Özet (abone, ilan, yapay zekâ harcaması)
        # Çalışma sayfasının "Summary" bölümünde görünür. Yalnızca sayılar; e-posta adresi yazılmaz.
        if: ${{ success() || failure() }}
        continue-on-error: true
        run: |
          {
            echo "## InternReader durumu"
            echo '```json'
            python -m internreader durum
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Site verisini depoya ekle (Vercel yeniden yayınlar)
        if: ${{ steps.kontrol.outputs.atla != 'true' }}
        run: |
          mkdir -p web/public/veri
          cp cikti/ilanlar.json cikti/istatistik.json web/public/veri/
          git config user.name "internreader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/veri
          if git diff --cached --quiet; then
            echo "Veri değişmedi."
          else
            git commit -m "veri: günlük güncelleme $(date -u +%F)"
            git pull --rebase
            git push
          fi
      - name: Önizleme (elle onay modu)
        # Son bültenden beri görülen yeni ilanlar adresleriyle TEST_EPOSTA'ya; yeni ilan yoksa e-posta gitmez.
        # Gizli değer yoksa iş başarısız olmaz, uyarı yazılır. Adres kayıtlarda görünmez (test_bulten.yml ile aynı).
        if: ${{ steps.kontrol.outputs.atla != 'true' && env.INTERNREADER_BULTEN_ELLE == '1' }}
        env:
          TEST_EPOSTA: ${{ secrets.TEST_EPOSTA }}
        run: |
          if [ -z "$TEST_EPOSTA" ]; then
            echo "::warning::TEST_EPOSTA gizli değeri yok: önizleme gönderilmedi (docs/KURULUM_UCRETSIZ.md, bölüm 13)"
            exit 0
          fi
          echo "::add-mask::$(printf '%s' "$TEST_EPOSTA" | tr '[:upper:]' '[:lower:]')"
          python -m internreader bulten-dene "$TEST_EPOSTA" --yeni
