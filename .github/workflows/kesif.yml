# Firma keşfi (yapay zekâ kullanmaz):
# - her pazartesi: arama API'siyle listede olmayan firmaları bul (SERPER_API_KEY ya da BRAVE_API_KEY yoksa atlanır)
# - ayın 1'i: listedeki tüm firmaların ilan sistemi / kariyer sayfası keşfi
# - elle çalıştırma: ikisi birden, kaynağı bilinmeyen bütün firmalar için (Serper kredisi harcar, aşağıdaki sayılar kadar)
name: Keşif

on:
  schedule:
    - cron: "0 3 * * 1" # pazartesi 06:00 (Türkiye)
    - cron: "0 2 1 * *" # ayın 1'i 05:00 (Türkiye)
  workflow_dispatch:
    inputs:
      kariyer_ara:
        description: "Kaç firmanın kariyer sayfası aransın (firma başına bir Serper kredisi)"
        type: number
        default: 1200
      web_bul:
        description: "Sitesi bilinmeyen kaç firmanın web adresi aransın (firma başına bir Serper kredisi)"
        type: number
        default: 300

permissions:
  contents: read

concurrency:
  group: internreader-veritabani
  cancel-in-progress: false

jobs:
  kesif:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Bağımlılıklar
        run: pip install -r requirements.txt
      # Önce ücretsiz keşif: ana sayfasında kariyer bağlantısı olan firmaya arama kredisi harcanmaz
      - name: Aylık keşif
        if: ${{ github.event.schedule == '0 2 1 * *' || github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 50
        continue-on-error: true # takılsa da arama adımı çalışır
        run: python -m internreader kesif
      - name: Arama keşfi
        if: ${{ github.event.schedule != '0 2 1 * *' }}
        timeout-minutes: 60
        run: |
          python -m internreader arama-kesif --web-bul ${{ inputs.web_bul || 40 }}
          {
            echo '```json'
            python -m internreader kariyer-ara --sinir ${{ inputs.kariyer_ara || 40 }}
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Özet
        if: ${{ always() }}
        run: |
          {
            echo '```json'
            python -m internreader durum
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
