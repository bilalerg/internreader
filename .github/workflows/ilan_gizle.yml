# Elle onay: yanlış ilanı sitede ve e-postada gösterme (Actions → İlan gizle → Run workflow → ilan adresi).
# Adres sabah önizleme e-postasında yazar. İlan adresleri zaten herkese açık (sitede listelenir), girdi olarak alınabilir.
# Aynı firma + başlıklı kopyalar da gizlenir. Tarama gizli ilanı yeniden açmaz. Geri almak için "geri_al" işaretle.
# Gizledikten sonra site verisi yeniden üretilir; değiştiyse depoya eklenir (Vercel yeniden yayınlar).
name: İlan gizle

on:
  workflow_dispatch:
    inputs:
      adres:
        description: "İlanın adresi (önizleme e-postasında yazan)"
        type: string
        required: true
      geri_al:
        description: "Gizlenmiş ilanı yeniden göster"
        type: boolean
        default: false

permissions:
  contents: write # site verisini depoya eklemek için

concurrency:
  group: internreader-veritabani # sabah işi, ara tarama ve keşifle aynı anda veritabanına yazmasın
  cancel-in-progress: false

jobs:
  gizle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Bağımlılıklar
        run: pip install -r requirements.txt
      - name: Gizle, yayınla
        env:
          ADRES: ${{ inputs.adres }} # komuta ortam değişkeniyle geçer: girdi kabuk komutu olarak çalışamaz
          GERI_AL: ${{ inputs.geri_al }}
        run: |
          if [ "$GERI_AL" = "true" ]; then
            python -m internreader ilan-gizle "$ADRES" --geri-al
          else
            python -m internreader ilan-gizle "$ADRES"
          fi
          python -m internreader yayinla --ozetsiz
      - name: Site verisi değişti mi?
        id: fark
        run: echo "degisti=$(python -m internreader ilanlar-degisti-mi cikti/ilanlar.json web/public/veri/ilanlar.json)" >> "$GITHUB_OUTPUT"
      - name: Değiştiyse depoya ekle (Vercel yeniden yayınlar)
        if: ${{ steps.fark.outputs.degisti == 'true' }}
        run: |
          mkdir -p web/public/veri
          cp cikti/ilanlar.json cikti/istatistik.json web/public/veri/
          git config user.name "internreader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/veri
          git commit -m "veri: ilan gizlendi $(date -u +%FT%H:%M)"
          git pull --rebase
          git push
