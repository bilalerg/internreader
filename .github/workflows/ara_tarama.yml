# Günde dört kez ilan sistemleri (Lever, Greenhouse...) taranır; yeni ilan sitede gün içinde görünür.
# Kariyer sayfaları okunmaz: yapay zekâyla okundukları için pahalı, günlük tam taramada kalır. Bülten gönderilmez.
# Yalnızca veri gerçekten değiştiyse commit edilir: her commit bir Vercel dağıtımı demek; `guncelleme` damgası tek başına sayılmaz.
name: Ara tarama

on:
  schedule:
    - cron: "23 */6 * * *" # UTC 00:23, 06:23, 12:23, 18:23 (dakika başı olmayan saatte gecikme daha az)
  workflow_dispatch:

permissions:
  contents: write # site verisini depoya eklemek için

concurrency:
  group: internreader-veritabani # günlük çalışma ve keşifle aynı anda veritabanına yazmasın
  cancel-in-progress: false

jobs:
  ara_tarama:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Bağımlılıklar
        run: pip install -r requirements.txt
      - name: İlan sistemlerini tara, yayınla
        run: |
          python -m internreader tara --yalnizca-ats --yz-tavani 0.05
          python -m internreader yayinla --ozetsiz
      - name: Site verisi değişti mi?
        id: fark
        run: echo "degisti=$(python -m internreader ilanlar-degisti-mi cikti/ilanlar.json web/public/veri/ilanlar.json)" >> "$GITHUB_OUTPUT"
      - name: Değiştiyse depoya ekle (Vercel yeniden yayınlar)
        if: ${{ steps.fark.outputs.degisti == 'true' }}
        run: |
          mkdir -p web/public/veri
          cp cikti/ilanlar.json cikti/istatistik.json web/public/veri/
          git config user.name "internreader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/veri
          git commit -m "veri: ara güncelleme $(date -u +%FT%H:%M)"
          git pull --rebase
          git push
